# Alembic configuration for PatchLens.
#
# The database URL is taken from the application settings (DATABASE_URL), so the
# migrations, the API and the worker always agree on which database they manage.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Revisions are generated against the SQLite default; PostgreSQL is executed with
# the same migration set (pgvector columns are unconstrained so both work).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
