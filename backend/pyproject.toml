[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchlens"
version = "0.1.0"
description = "PatchLens - AI-assisted, repository-aware code review and test intelligence platform"
requires-python = ">=3.11"
readme = "../README.md"

[project.scripts]
patchlens = "patchlens.cli:main"

[tool.setuptools]
packages = ["patchlens"]

[tool.setuptools.package-data]
patchlens = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["patchlens", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # flake8-bugbear
  "C4",               # comprehensions
  "UP",               # pyupgrade
  "SIM",              # simplify
  "RET",              # return
  "PTH",              # pathlib
  "ASYNC",            # async correctness
  "S",                # bandit-style security
  "RUF",
]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "S101",   # assert is used in tests and in typed narrowing
  "SIM108", # explicit if/else is often clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S603", "S607", "S108"]
"patchlens/evaluation/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["patchlens"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
files = ["patchlens"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
exclude = ["patchlens/alembic/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: tests that exercise real local services or subprocesses",
  "sandbox: tests that execute code through the restricted test runner",
  "postgres: tests that require a live PostgreSQL+pgvector instance",
]
filterwarnings = ["error::DeprecationWarning:patchlens.*"]

[tool.coverage.run]
source = ["patchlens"]
branch = true
omit = ["patchlens/alembic/*", "patchlens/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
