# Production-shaped local stack: PostgreSQL + pgvector, Redis, migrations, API and
# worker. The application itself does not need any of this to run (SQLite + hashing
# embeddings are the zero-dependency default); this file exists so the Postgres and
# Redis paths can be exercised together.
#
#   docker compose up --build
#   curl http://127.0.0.1:8000/readyz
#
# NOTE: this file has not been executed in the development environment that wrote
# it (no Docker daemon was available). The application paths it configures are
# covered by tests that run against SQLite; treat the Compose stack as untested
# until `docker compose up` has been run and recorded.

name: patchlens

x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-patchlens}:${POSTGRES_PASSWORD:-patchlens}@db:5432/${POSTGRES_DB:-patchlens}
  REDIS_URL: redis://redis:6379/0
  # The migrate service owns the schema; never let request handlers create tables.
  AUTO_CREATE_SCHEMA: "false"
  API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  # Retrieval: the hashing provider is deterministic and needs no credentials.
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hashing-ngram-v2}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-512}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patchlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchlens}
      POSTGRES_DB: ${POSTGRES_DB:-patchlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    # Redis is an optional low-latency wake-up channel. The durable job queue is
    # the `jobs` table, so losing Redis cannot lose work.
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    command: ["python", "-m", "patchlens.cli", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "patchlens.cli", "worker"]
    environment: *backend-environment
    # Indexing and reviewing a large repository can exceed the default 10s grace.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
